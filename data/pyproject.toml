[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tononkira-data"
version = "0.1.0"
description = "Collecte des paroles de chansons malagasy pour Tononkira."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tononkira-data = "tononkira_data.cli:main"

[tool.setuptools.packages.find]
include = ["tononkira_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
